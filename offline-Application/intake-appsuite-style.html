<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詳細受付 AppSuite風サンプル</title>
<style>
:root{
  --top:#24466f; --top2:#1b3757; --blue:#2f6fb5; --blue-d:#245a95; --blue-soft:#e8f0fa;
  --bg:#eceff3; --panel:#ffffff; --line:#cfd6de; --line2:#e2e7ec; --head:#e9edf2; --label:#f4f6f9;
  --ink:#222b35; --muted:#66727f; --req:#d6363a;
  --g:#1f9d55; --g-soft:#e3f4e9; --y:#e0a800; --y-soft:#fdf3d4; --r:#c9302c; --r-soft:#fbe3e2;
  --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --top:#1a2f4a; --top2:#13243a; --blue-soft:#1d2d44; --bg:#14181d; --panel:#1c2229; --line:#34404d; --line2:#2a333d; --head:#252d36; --label:#212830; --ink:#e3e8ee; --muted:#9aa6b3; --g-soft:#12301f; --y-soft:#352c0e; --r-soft:#3a1818; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.6}
a{color:var(--blue);cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}

/* ---- groupware frame ---- */
.gw-top{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;background:linear-gradient(180deg,var(--top),var(--top2));color:#fff}
.gw-top .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap}
.gw-top .logo .sq{width:24px;height:24px;border-radius:5px;background:#fff;color:var(--top);display:grid;place-items:center}
.gw-top .badge{font-size:11px;padding:1px 8px;border-radius:3px;background:#f0a830;color:#222;font-weight:700;white-space:nowrap}
.gw-top .sp{flex:1}
.gw-top .who{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
.gw-top select{background:#fff;color:#222;border:0;border-radius:3px;padding:3px 6px;font-size:12px}
.gw-top .clock{font-size:12px;opacity:.85;white-space:nowrap}
.gw-menu{display:flex;gap:2px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.gw-menu button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:4px 6px;border:0;background:none;border-radius:4px;cursor:pointer;font-size:11px;color:var(--muted)}
.gw-menu button .tile{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#fff}
.gw-menu button:hover{background:var(--head)}
.gw-menu button.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.crumb{padding:6px 14px;font-size:12px;color:var(--muted);background:var(--bg)}
.crumb b{color:var(--ink)}

.as{display:grid;grid-template-columns:220px minmax(0,1fr);gap:10px;padding:0 10px 20px}
.side{display:flex;flex-direction:column;gap:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:3px}
.box h3{margin:0;padding:7px 10px;font-size:12px;background:var(--head);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.applist{list-style:none;margin:0;padding:4px 0}
.applist li a{display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--ink);text-decoration:none}
.applist li a:hover{background:var(--blue-soft)}
.applist li a.on{background:var(--blue-soft);color:var(--blue);font-weight:700;border-left:3px solid var(--blue);padding-left:7px}
.applist li a.dis{color:var(--muted);cursor:default}
.applist .ai{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:#fff;flex:none}
.flt{list-style:none;margin:0;padding:4px 0}
.flt li a{display:flex;justify-content:space-between;padding:4px 10px;color:var(--ink);text-decoration:none}
.flt li a:hover{background:var(--blue-soft)}
.flt li a.on{font-weight:700;color:var(--blue)}
.flt em{font-style:normal;color:var(--muted);font-size:11px;background:var(--head);border-radius:8px;padding:0 6px}

.main{min-width:0}
.apphead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0}
.apphead .aicon{width:34px;height:34px;border-radius:6px;background:#e3792b;color:#fff;display:grid;place-items:center}
.apphead h1{margin:0;font-size:15px}
.apphead p{margin:0;font-size:11.5px;color:var(--muted)}
.vtabs{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);border-top:1px solid var(--line2);padding:0 8px;overflow-x:auto}
.vtabs button{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
.vtabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.view{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 3px 3px;padding:12px;min-height:400px;animation:fade .25s ease}
@keyframes fade{from{opacity:.3}to{opacity:1}}

.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid var(--line);background:var(--panel);border-radius:3px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--head)}
.btn.pri{background:var(--blue);border-color:var(--blue-d);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.dng{color:var(--r);border-color:color-mix(in srgb,var(--r) 50%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.toolbar .sp{flex:1}
.search{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:6px;padding:8px;background:var(--label);border:1px solid var(--line2);border-radius:3px;margin-bottom:10px;align-items:end}
.search label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:3px;padding:4px 7px;background:var(--panel);width:100%}
textarea{resize:vertical;min-height:62px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--blue) 40%,transparent);border-color:var(--blue)}

table.lst{width:100%;border-collapse:collapse;font-size:12.5px}
table.lst th,table.lst td{border:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:middle}
table.lst th{background:var(--head);font-weight:700;white-space:nowrap;cursor:pointer;user-select:none}
table.lst th .arr{color:var(--muted);font-size:10px}
table.lst tbody tr{cursor:pointer}
table.lst tbody tr:nth-child(even){background:color-mix(in srgb,var(--label) 60%,transparent)}
table.lst tbody tr:hover{background:var(--blue-soft)}
table.lst tr.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:#fff3b0}100%{background:transparent}}
.tw{overflow-x:auto}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
.pager .pg{display:flex;gap:3px}
.pager .pg button{min-width:28px;padding:2px 6px;border:1px solid var(--line);background:var(--panel);border-radius:3px;cursor:pointer}
.pager .pg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.sig{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:10px;white-space:nowrap}
.sig i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sig.g{background:var(--g-soft);color:var(--g)}.sig.g i{background:var(--g)}
.sig.y{background:var(--y-soft);color:#9a7400}.sig.y i{background:var(--y)}
.sig.r{background:var(--r-soft);color:var(--r)}.sig.r i{background:var(--r)}
@media (prefers-color-scheme:dark){.sig.y{color:#f3c64b}}
.st{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:3px;border:1px solid var(--line);white-space:nowrap;background:var(--label)}
.st.received{background:#eef3fb;border-color:#b9cce6;color:#2f5f9e}
.st.review,.st.wait{background:#fff6df;border-color:#ecd28f;color:#8a6500}
.st.approved,.st.dev,.st.verify,.st.field{background:#e7f5ef;border-color:#a9d8bf;color:#1d7a4a}
.st.done{background:#e9e9ef;border-color:#c5c5d1;color:#555}
.st.back{background:#fde8e7;border-color:#efb3b0;color:#b42d29}
.st.hold{background:#efefef;border-color:#cfcfcf;color:#777}
@media (prefers-color-scheme:dark){.st{background:var(--label)!important;color:var(--ink)!important}}

/* form */
.formgrid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px;align-items:start}
.sec{margin-bottom:14px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.sec h2{margin:0;padding:6px 10px;font-size:13px;background:var(--head);border-bottom:1px solid var(--line);border-left:4px solid var(--blue);display:flex;align-items:center;gap:6px}
table.frm{width:100%;border-collapse:collapse}
table.frm th{width:190px;background:var(--label);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top;font-size:12.5px}
table.frm td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.frm tr:last-child th,table.frm tr:last-child td{border-bottom:0}
.req{display:inline-block;font-size:10px;color:#fff;background:var(--req);border-radius:2px;padding:0 4px;margin-left:6px;vertical-align:1px;font-weight:700}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.opts{display:flex;flex-wrap:wrap;gap:4px 14px}
.opts label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.opts.col{flex-direction:column}
.crit{display:flex;flex-direction:column;gap:6px}
.crit .ci{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;align-items:start}
.crit .ci b{font-size:11px;color:var(--muted);padding-top:5px}
.lint{font-size:11.5px;margin-top:2px;display:none}
.lint.vague,.lint.short{display:block;color:#a35b00}
.lint.ok{display:block;color:var(--g)}
.ci input.vague{border-color:#e0a800;background:var(--y-soft)}
.errs{display:none;margin-bottom:10px;padding:8px 12px;border:1px solid #efb3b0;background:var(--r-soft);border-radius:3px;color:var(--r)}
.errs.show{display:block}
.errs ul{margin:4px 0 0;padding-left:18px}
.calc{font-weight:700;font-size:15px}
.formbtns{display:flex;gap:8px;justify-content:center;padding:12px;border-top:1px solid var(--line2);background:var(--label);position:sticky;bottom:0;z-index:5}
.err-field{outline:2px solid var(--r)!important}

.sum{position:sticky;top:10px;display:flex;flex-direction:column;gap:10px}
.lamp{display:flex;gap:8px;justify-content:center;padding:12px;background:#2a2f36;border-radius:6px}
.lamp span{width:40px;height:40px;border-radius:50%;opacity:.2;transition:all .35s}
.lamp .lg{background:#22b463}.lamp .ly{background:#f5c400}.lamp .lr{background:#e3403a}
.lamp span.on{opacity:1;box-shadow:0 0 18px currentColor}
.lamp .lg.on{color:#22b463}.lamp .ly.on{color:#f5c400}.lamp .lr.on{color:#e3403a}
.reasons{list-style:none;margin:8px 0 0;padding:0;font-size:12px}
.reasons li{display:flex;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line2)}
.reasons li:last-child{border-bottom:0}
.reasons i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px}
.reasons i.g{background:var(--g)}.reasons i.y{background:var(--y)}.reasons i.r{background:var(--r)}
.box .in{padding:10px}
.mbar{display:grid;grid-template-columns:110px minmax(0,1fr) 16px;gap:6px;align-items:center;font-size:11.5px;margin:3px 0}
.mbar .b{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.mbar .b i{display:block;height:100%;background:var(--blue);transition:width .5s}
.bigh{font-size:22px;font-weight:800;color:var(--blue)}

/* detail */
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.dhead h2{margin:0;font-size:16px;flex-basis:100%}
.dhead .no{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.flow{display:flex;gap:0;margin:0 0 12px;overflow-x:auto;padding-bottom:4px}
.flow div{flex:1;min-width:76px;text-align:center;font-size:11px;padding:6px 2px;background:var(--label);border:1px solid var(--line2);position:relative;color:var(--muted)}
.flow div.past{background:var(--blue-soft);color:var(--blue)}
.flow div.cur{background:var(--blue);color:#fff;font-weight:700;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}}
.flow.off div.cur{background:var(--r)}
ul.tl{list-style:none;margin:0;padding:0 0 0 12px;border-left:2px solid var(--line2)}
ul.tl li{position:relative;padding:0 0 10px 10px;font-size:12px}
ul.tl li::before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--panel)}
ul.tl li small{color:var(--muted);display:block}
.cmt{border-bottom:1px solid var(--line2);padding:6px 0;font-size:12.5px}
.cmt small{color:var(--muted);display:block}
.vlist{margin:0;padding-left:18px}
.empty{color:var(--muted)}
mark.vague{background:var(--y-soft);color:inherit;border-bottom:2px solid var(--y)}

/* agg */
table.x{border-collapse:collapse;font-size:12.5px;width:100%}
table.x th,table.x td{border:1px solid var(--line2);padding:5px 8px;text-align:center}
table.x th{background:var(--head)}
table.x td.l,table.x th.l{text-align:left}
table.x tr.tot td{font-weight:700;background:var(--label)}
.heat{display:inline-block;min-width:26px;padding:0 6px;border-radius:3px;font-weight:700}
.hbar{display:grid;grid-template-columns:90px minmax(0,1fr) 30px;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.hbar .b{height:14px;background:var(--line2);border-radius:2px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--blue);width:0;transition:width .9s ease}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kp div{border:1px solid var(--line);border-radius:3px;padding:8px 10px;background:var(--label)}
.kp b{display:block;font-size:20px;color:var(--blue)}
.kp small{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* modal + toast */
.mask{position:fixed;inset:0;background:rgba(10,20,30,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 12px;overflow:auto}
.mask.show{display:flex;animation:fade .2s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:4px;width:min(640px,100%);box-shadow:0 12px 40px rgba(0,0,0,.3);animation:drop .25s ease}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0;padding:9px 12px;background:var(--head);border-bottom:1px solid var(--line);font-size:13.5px;display:flex;align-items:center;gap:6px}
.modal .mb{padding:12px;max-height:65vh;overflow:auto}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line2);background:var(--label)}
pre.yaml{margin:0;background:#0f1b29;color:#d7e3ef;padding:12px;border-radius:3px;font-size:12px;line-height:1.6;overflow:auto;white-space:pre}
.stopt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.stopt label{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line2);border-radius:3px;cursor:pointer}
.stopt label.dis{opacity:.4;cursor:not-allowed}
.warnbox{padding:8px 10px;border:1px solid #efb3b0;background:var(--r-soft);border-radius:3px;margin-top:8px;display:none}
.warnbox.show{display:block}
#toast{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:6px}
.toast{background:#253446;color:#fff;padding:9px 14px;border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:12.5px;animation:tin .3s ease;display:flex;gap:8px;align-items:center}
.toast.ok{border-left:4px solid #22b463}.toast.ng{border-left:4px solid #e3403a}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.notice{font-size:11.5px;color:var(--muted);padding:6px 10px;margin:8px 10px 0;border:1px dashed var(--line);border-radius:3px;background:var(--panel)}

@media (max-width:1000px){
  .formgrid,.dgrid{grid-template-columns:1fr}
  .sum{position:static}
}
@media (max-width:760px){
  .as{grid-template-columns:1fr}
  .side{order:2}
  .search{grid-template-columns:1fr 1fr}
  table.frm th{width:auto;display:block;border-bottom:0;padding-bottom:2px}
  table.frm td{display:block}
  table.frm tr{display:block;border-bottom:1px solid var(--line2)}
  .gw-top .clock{display:none}
  .gw-top{flex-wrap:wrap;height:auto;padding:6px 10px;row-gap:4px}
  .gw-top .sp{display:none}
  .gw-top .who{width:100%}
  .gw-top .who select{flex:1;min-width:0}
  table.lst{min-width:720px}
  table.lst td:first-child{white-space:nowrap}
  .gw-menu button{min-width:64px}
  .kp,.two{grid-template-columns:1fr 1fr}
  .stopt{grid-template-columns:1fr}
}
@media print{
  .gw-top,.gw-menu,.crumb,.side,.vtabs,.toolbar,.formbtns,.notice,#toast,.dbtns{display:none!important}
  .as{display:block;padding:0}
  .view{border:0}
  body{background:#fff}
}
</style>
</head>

        row('承認者（業務責任者）',1,'<select name="approver">'+approvers.map(a=>'<option'+(r.approver===a?' selected':'')+'>'+a+'</option>').join('')+'</select>','信号の色の最終決定と承認は、この人が行います','approver'))+

  function attHtml(a){ return (a||[]).length ? (a||[]).map((x,i)=>'📎 '+E(x.name)+' <small>('+Math.max(1,Math.round(x.size/1024))+' KB)</small> <a data-rm="'+i+'">削除</a>').join('<br>') : 'なし'; }
  function collect(base){
    const f = $('#frm'), r = base ? JSON.parse(JSON.stringify(base)) : SF.blank(S.role);
    const v = n => (f.elements[n] ? f.elements[n].value : '');
    const rv = n => { const x = f.querySelector('input[name='+n+']:checked'); return x ? x.value : ''; };
    const cv = n => $$('input[name='+n+']:checked', f).map(x=>x.value);
    Object.assign(r, {applicant:v('applicant').trim(), dept:v('dept'), contact:v('contact').trim(), title:v('title').trim(), kind:rv('kind'), toolRef:v('toolRef'), wish:v('wish'),
      problem:v('problem').trim(), purpose:v('purpose').trim(), users:cv('users'), people:v('people'), places:cv('places'), scope:v('scope').trim(), outScope:v('outScope').trim(),
      criteria:[0,1,2,3,4].map(i=>v('crit'+i).trim()).filter(Boolean), decides:rv('decides'), data:cv('data'), parties:rv('parties')||'社内のみ', constraints:cv('constraints'),
      constraintsOther:v('constraintsOther').trim(), approvals:cv('approvals'), freq:rv('freq'), minutes:v('minutes'), dataReady:rv('dataReady'), spread:rv('spread'),
      attachments:(S._att||[]).slice(), approver:v('approver')});
    return r;
  }
  function live(){
    const r = collect(null), j = SF.judge(r), m = SF.measure(r);
    $$('.lamp span').forEach(s => s.classList.toggle('on', s.classList.contains('l'+j.c)));
    $('#sigTxt').innerHTML = sig(j.c) + ' <small>'+SF.COLORS[j.c].n+'</small>';
    $('#reasons').innerHTML = j.reasons.map(x=>'<li><i class="'+x.c+'"></i>'+E(x.t)+'</li>').join('');
    $('#calcH').textContent = m.hours; $('#sumH').textContent = m.hours;
    $('#mbars').innerHTML = m.scores.map(s=>'<div class="mbar"><span>'+E(s.l)+'</span><span class="b"><i style="width:'+(s.v*20)+'%"></i></span><b>'+(s.v||'－')+'</b></div>').join('') + '<div class="hint">5点満点の目安です。着手順はこの点数だけでは決めません。</div>';
    let ok=0, bad=0;
    [0,1,2,3,4].forEach(i => {
      const inp = $('#frm').elements['crit'+i], L = SF.lint(inp.value), box = $('.lint[data-l="'+i+'"]');
      inp.classList.toggle('vague', L.level==='vague');
      box.className = 'lint ' + (L.level==='empty'?'':L.level); box.textContent = L.level==='empty' ? '' : (L.ok ? '✓ ' : '△ ') + L.tip;
      if (L.level!=='empty') { L.ok ? ok++ : bad++; }
    });
    $('#critSum').innerHTML = '<div>検査できる書き方：<b style="color:var(--g)">'+ok+'</b> 件</div><div>書き直しをおすすめ：<b style="color:#a35b00">'+bad+'</b> 件</div>' + (ok+bad===0 ? '<div class="hint">1件以上書いてください</div>' : '');
  }
  function submit(editing){
    const r = collect(editing), errs = [];
    $$('.err-field').forEach(x=>x.classList.remove('err-field'));
    const need = (cond, id, msg) => { if (!cond) { errs.push(msg); const row = $('#row-'+id); if (row) row.querySelector('td').classList.add('err-field'); } };
    need(r.applicant, 'applicant', '起票者を入力してください');
    need(r.title, 'title', '件名を入力してください');
    need(r.kind, 'kind', '依頼区分を選んでください');
    need(r.problem, 'problem', '困っていることを入力してください');
    need(r.purpose, 'purpose', '目的を入力してください');

    const box = $('#errs');
    if (errs.length) { box.innerHTML = ico('i-alert')+' 入力内容を確認してください<ul>'+errs.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>'; box.classList.add('show'); window.scrollTo({top:0,behavior:'smooth'}); return; }
    box.classList.remove('show');
    const now = SF.nowISO();
    if (editing) {
      r.updatedAt = now; r.history.push({at:now, by:me().name, role:me().l, action:'内容を編集', note:''});
      const i = S.data.items.findIndex(x=>x.id===editing.id); S.data.items[i] = r;
      persist(); toast(r.id+' を更新しました'); go('detail',{detail:r.id});
    } else {
      r.id = SF.nextId(S.data); r.createdAt = now; r.updatedAt = now; r.status = 'received';
      r.history = [{at:now, by:r.applicant, role:me().l, action:'受付', note:'依頼を登録しました'}];
      S.data.items.push(r); persist(); S.flash = r.id; S.sort={k:'id',d:-1}; S.fStatus=''; S.fColor=''; S.q=''; S.fDept=''; S.page=1;

    }
  }

        sec('ものさし（参考）','i-chart', f('頻度・手間',(fq?E(fq.l):'－')+' ／ '+(r.minutes?E(r.minutes)+' 分':'－'))+f('月あたり削減見込み','<b>'+m.hours+'</b> 時間／月')+f('元になるデータ',rd?E(rd.l):'－')+f('広げられる範囲',sp?E(sp.l):'－'))+

  /* ---- 状態変更 ---- */
  function openStatus(r){
    const j = SF.judge(r), sugg = SF.NEXT[r.status];
    const opts = SF.STATUSES.map(s => { const ok = SF.canMove(S.role, r.status, s.k);
      return '<label class="'+(ok?'':'dis')+'"><input type="radio" name="ns" value="'+s.k+'"'+(ok?'':' disabled')+(ok && s.k===sugg?' checked':'')+'>'+st(s.k)+(s.k===sugg?' <small class="empty">次の工程</small>':'')+'</label>'; }).join('');
    modal(ico('i-flag')+'状態を変更（'+E(r.id)+'）',
      '<div style="margin-bottom:8px">いまの状態：'+st(r.status)+'　操作する人：<b>'+E(me().name)+'</b>（'+E(me().l)+'）</div>'+
      '<div class="stopt">'+opts+'</div>'+
      '<div class="hint">「承認済み」「完了」にできるのは承認者だけです（サンプルの権限設定）。</div>'+
      '<div id="apv" style="display:none;margin-top:10px;padding:10px;border:1px solid var(--line2);border-radius:3px">'+
        '<b>信号の色を決める</b><span class="req">必須</span><div class="hint">判定の候補は '+sig(j.c)+' です。迷ったら1つ上の色にします。</div>'+
        '<div class="opts" style="margin-top:6px">'+['g','y','r'].map(c=>'<label><input type="radio" name="fc" value="'+c+'"'+((r.signalFinal||j.c)===c?' checked':'')+'>'+sig(c)+'</label>').join('')+'</div>'+
        '<div class="warnbox" id="redw"><label><input type="checkbox" id="redok"> 赤信号の仕事は<b>AIに決めさせません</b>。道具の範囲が「材料集め・表示」までに限られ、決定は人が行うことを確認しました。</label></div>'+
      '</div>'+
      '<label style="display:block;margin-top:10px">メモ（差戻し・見送りのときは必須）<textarea id="note" placeholder="例：合格の条件を数字で書き直してください"></textarea></label>',
      '<button class="btn" data-x type="button">キャンセル</button><button class="btn pri" id="doSt" type="button">'+ico('i-check')+'変更する</button>');
    const upd = () => { const v = ($('input[name=ns]:checked')||{}).value; $('#apv').style.display = v==='approved' ? 'block' : 'none';
      const fc = ($('input[name=fc]:checked')||{}).value; $('#redw').classList.toggle('show', v==='approved' && fc==='r'); };
    $$('#modal input[name=ns], #modal input[name=fc]').forEach(x=>x.addEventListener('change', upd)); upd();
    $('#doSt').addEventListener('click', () => {
      const v = ($('input[name=ns]:checked')||{}).value, note = $('#note').value.trim();
      if (!v) return toast('変更先の状態を選んでください', true);
      if (['back','hold'].includes(v) && !note) return toast('差戻し・見送りの理由をメモに書いてください', true);
      let extra = '';
      if (v==='approved') { const fc = ($('input[name=fc]:checked')||{}).value; if(!fc) return toast('信号の色を選んでください', true);
        if (fc==='r' && !$('#redok').checked) return toast('赤信号の確認にチェックしてください', true);
        r.signalFinal = fc; extra = '信号の色を「'+SF.COLORS[fc].l+'」に決定'; }
      const now = SF.nowISO();
      r.history.push({at:now, by:me().name, role:me().l, action:'状態を「'+SF.statusOf(v).l+'」に変更', note:[extra,note].filter(Boolean).join('／')});
      if (note) { r.comments = r.comments||[]; r.comments.push({at:now, by:me().name, text:note}); }
      r.status = v; r.updatedAt = now; persist(); closeModal(); toast(r.id+' を「'+SF.statusOf(v).l+'」にしました'); renderDetail(); renderSide();
    });
  }

  /* ---- 注文書 ---- */
  function openYaml(r){
    const y = SF.toYAML(r);
    modal(ico('i-doc')+'注文書（作業指示書）　'+E(r.id),
      '<div class="hint" style="margin-bottom:6px">AIへ渡す作業指示書の形（YAML）です。レビューしてから使います。</div><pre class="yaml">'+E(y)+'</pre>',
      '<button class="btn" id="cpY" type="button">'+ico('i-copy')+'コピー</button><button class="btn" id="dlY" type="button">'+ico('i-down')+'ダウンロード</button><button class="btn pri" data-x type="button">閉じる</button>');
    $('#cpY').addEventListener('click', () => { try { navigator.clipboard.writeText(y).then(()=>toast('コピーしました'), ()=>toast('コピーできませんでした', true)); } catch(e) { toast('コピーできませんでした', true); } });
    $('#dlY').addEventListener('click', () => SF.download((r.id||'draft')+'_注文書.yaml', y, 'text/yaml') ? toast('ダウンロードしました') : toast('ダウンロードできませんでした', true));
  }

  /* ---- 集計 ---- */
  function renderAgg(){
    const it = S.data.items, col = r => r.signalFinal||SF.judge(r).c;
    const tot = {g:0,y:0,r:0}; it.forEach(r=>tot[col(r)]++);
    const hours = Math.round(it.reduce((a,r)=>a+SF.measure(r).hours,0));
    const active = it.filter(r=>!['done','hold'].includes(r.status)).length;
    const waiting = it.filter(r=>r.status==='wait');
    const heat = (n, c) => n ? '<span class="heat" style="background:'+({g:'var(--g-soft)',y:'var(--y-soft)',r:'var(--r-soft)'})[c]+'">'+n+'</span>' : '<span class="empty">0</span>';
    const depts = CATALOG.map(d => { const a = it.filter(r=>r.dept===d.id); return {d, g:a.filter(r=>col(r)==='g').length, y:a.filter(r=>col(r)==='y').length, r:a.filter(r=>col(r)==='r').length, n:a.length, h:Math.round(a.reduce((s,r)=>s+SF.measure(r).hours,0))}; });
    const maxS = Math.max(1, ...SF.STATUSES.map(s=>it.filter(r=>r.status===s.k).length));
    $('#view').innerHTML =
      '<div class="kp"><div><small>受付件数</small><b>'+it.length+'</b></div><div><small>進行中（完了・見送り以外）</small><b>'+active+'</b></div><div><small>承認待ち</small><b>'+waiting.length+'</b></div><div><small>月あたり削減見込み（合計）</small><b>'+hours+'<small> h</small></b></div></div>'+
      '<div class="two"><div class="sec"><h2>'+ico('i-chart')+'部署 × 信号の色</h2><div class="tw"><table class="x"><thead><tr><th class="l">部署</th><th>青</th><th>黄</th><th>赤</th><th>計</th><th>削減見込み</th></tr></thead><tbody>'+
        depts.map(x=>'<tr><td class="l">'+E(x.d.name)+'</td><td>'+heat(x.g,'g')+'</td><td>'+heat(x.y,'y')+'</td><td>'+heat(x.r,'r')+'</td><td><b>'+x.n+'</b></td><td>'+(x.h?x.h+' h':'－')+'</td></tr>').join('')+
        '<tr class="tot"><td class="l">合計</td><td>'+tot.g+'</td><td>'+tot.y+'</td><td>'+tot.r+'</td><td>'+it.length+'</td><td>'+hours+' h</td></tr></tbody></table></div></div>'+
      '<div><div class="sec"><h2>'+ico('i-flag')+'状態別の件数</h2><div class="in" style="padding:10px">'+SF.STATUSES.map(s=>{ const n=it.filter(r=>r.status===s.k).length; return '<div class="hbar"><span>'+E(s.l)+'</span><span class="b"><i data-w="'+(n/maxS*100)+'"></i></span><b>'+n+'</b></div>'; }).join('')+'</div></div>'+
      '<div class="sec"><h2>'+ico('i-clock')+'承認待ちの一覧</h2><div style="padding:10px">'+(waiting.length ? waiting.map(r=>'<div class="cmt"><a data-id="'+E(r.id)+'">'+E(r.id)+'　'+E(r.title)+'</a> '+sig(SF.judge(r).c)+'<small>承認者：'+E(r.approver)+'</small></div>').join('') : '<span class="empty">承認待ちはありません</span>')+'</div></div></div></div>'+
      '<div class="hint">※ 削減見込みは「人数 × 頻度 × 1回の手間」で出した上限の目安です。着手順はこの数字だけでは決めません。</div>';
    requestAnimationFrame(()=>$$('.hbar .b i').forEach(i=>i.style.width=i.dataset.w+'%'));
    $$('#view a[data-id]').forEach(a=>a.addEventListener('click',()=>go('detail',{detail:a.dataset.id})));
  }

      ['所属部署','ドロップダウン（または組織選択）','必須','17部署'],
      ['連絡先','文字列（1行）','',''],
      ['件名','文字列（1行）','必須','60文字まで'],
      ['依頼区分','ラジオボタン','必須',SF.KINDS.join('／')],
      ['道具カタログとの関係','ドロップダウン（または他アプリの参照）','','道具カタログを別アプリにして参照すると更新が楽'],
      ['希望時期','日付','',''],
      ['困っていること','文字列（複数行）','必須',''],
      ['目的','文字列（複数行）','必須',''],
      ['だれが使う？','チェックボックス','必須',SF.USERS.join('／')],
      ['使う人の人数','数値','','単位：人'],
      ['どこで使う？','チェックボックス','',SF.PLACES.join('／')],
      ['作るもの','文字列（複数行）','必須','1行に1項目'],
      ['今回は作らない','文字列（複数行）','',''],
      ['合格の条件1〜5','文字列（1行）×5','1件目は必須','検査できない言葉のチェックは、運用ルール・入力例で補う'],
      ['この道具がすること','ラジオボタン','必須','青／黄／赤の判定材料'],
      ['扱う情報','チェックボックス','',SF.DATA.map(x=>x.l).join('／')],
      ['関わる相手','ラジオボタン','',SF.PARTIES.join('／')],
      ['守ること','チェックボックス＋文字列（複数行）','',''],
      ['必ず人に聞くこと','チェックボックス','',SF.APPROVALS.join('／')],
      ['頻度','ラジオボタン','',SF.FREQ.map(x=>x.l).join('／')],
      ['1回あたりの手間','数値','','単位：分'],
      ['月あたり削減見込み','計算','','人数 × 頻度係数 × 手間 ÷ 60（頻度係数：毎日20／毎週4／毎月1／ときどき0.3）'],
      ['元になるデータ','ラジオボタン','',''],
      ['広げられる範囲','ラジオボタン','',''],
      ['添付ファイル','添付ファイル','',''],
      ['承認者','ユーザー選択','必須',''],
      ['状態','ドロップダウン','必須',SF.STATUSES.map(x=>x.l).join('→')],
      ['信号の色（決定）','ラジオボタン','承認時に必須','承認者だけが変更できる権限にする'],
      ['信号の色（判定候補）','計算（または手入力）','','計算でむずかしい場合は受付担当が入力']
    ];
    $('#view').innerHTML =
      '<div class="hint" style="margin-bottom:8px">このサンプルの項目を、実際の AppSuite で作る場合の部品の対応表（例）です。部品の名前や使える機能は、お使いの版で確認してください。</div>'+
      '<div class="tw"><table class="lst" style="cursor:default"><thead><tr><th>項目名</th><th>部品の種類（例）</th><th>必須</th><th>選択肢・備考</th></tr></thead><tbody>'+
      P.map(p=>'<tr style="cursor:default"><td><b>'+E(p[0])+'</b></td><td>'+E(p[1])+'</td><td>'+(p[2]?'<span class="req" style="margin:0">'+E(p[2])+'</span>':'')+'</td><td>'+E(p[3])+'</td></tr>').join('')+'</tbody></table></div>'+
      '<div class="two" style="margin-top:12px">'+
        '<div class="sec"><h2>'+ico('i-gear')+'運用ルール（例）</h2><div style="padding:10px"><ul class="vlist">'+
          '<li>受付・相談・承認依頼の<b>入口</b>は desknet\'s NEO / AppSuite。正式な判断は対象のPR等へ記録する</li>'+
          '<li>「承認済み」「完了」への変更と、信号の色（決定）の入力は<b>承認者だけ</b>ができる権限にする</li>'+
          '<li>赤信号は、道具の範囲を「材料集め・表示」に変えてから承認する（決定は人）</li>'+
          '<li>状態が「承認済み」になったら、注文書（YAML）を開発ラインへ渡す</li></ul></div></div>'+
        '<div class="sec"><h2>'+ico('i-alert')+'このサンプルについて</h2><div style="padding:10px"><ul class="vlist">'+
          '<li>実製品の画面ではなく、AppSuite 風の画面イメージです</li>'+
          '<li>データはこのブラウザの中だけに保存され、外部へは送信しません</li>'+
          '<li>役割の切り替えは動作確認用です（本番はログインで判別）</li>'+
          '<li>JSON出力したデータは、オリジナルWebUI版にも取り込めます</li></ul></div></div></div>';

  /* ---- 道具カタログ（参照） ---- */
  function openCatalog(){
    modal(ico('i-book')+'部署別 道具カタログ（参照）',
      '<input type="search" id="cq" placeholder="キーワードで絞り込み" style="margin-bottom:8px"><div id="clist"></div>',
      '<button class="btn pri" data-x type="button">閉じる</button>');
    const draw = () => { const q = $('#cq').value.trim();
      $('#clist').innerHTML = CATALOG.map(d => { const ts = d.tools.map((t,i)=>({t,i})).filter(x=>!q || (x.t[0]+x.t[1]).includes(q)); if(!ts.length) return '';
        return '<div class="sec"><h2>'+E(d.name)+'</h2><table class="frm">'+ts.map(x=>'<tr><th style="width:auto">'+sig(x.t[2])+' '+E(x.t[0])+'</th><td>'+E(x.t[1])+'<div style="margin-top:4px"><a data-use="'+d.id+'|'+x.i+'">この道具で新規登録</a></div></td></tr>').join('')+'</table></div>'; }).join('') || '<div class="empty">見つかりません</div>'; };
    $('#cq').addEventListener('input', draw); draw();
    $('#clist').addEventListener('click', e => { const a = e.target.closest('[data-use]'); if(!a) return; closeModal(); go('form');
      const f = $('#frm'); f.toolRef.value = a.dataset.use; f.toolRef.dispatchEvent(new Event('change')); toast('カタログの道具を選んで新規登録を始めました'); });
  }

  /* ---- modal ---- */
  function modal(title, body, foot){
    $('#modal').innerHTML = '<h3>'+title+'</h3><div class="mb">'+body+'</div><div class="mf">'+foot+'</div>';
    $('#mask').classList.add('show');
    $$('#modal [data-x]').forEach(b=>b.addEventListener('click', closeModal));
  }
  function closeModal(){ $('#mask').classList.remove('show'); }
  $('#mask').addEventListener('click', e => { if (e.target.id==='mask') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
  function confirmBox(title, msg, okLabel, fn){
    modal(ico('i-alert')+E(title), '<p style="margin:0">'+E(msg)+'</p>', '<button class="btn" data-x type="button">キャンセル</button><button class="btn pri" id="cfOk" type="button">'+E(okLabel)+'</button>');
    $('#cfOk').addEventListener('click', () => { closeModal(); fn(); });
  }

  notice(); render();
})();
</script>
