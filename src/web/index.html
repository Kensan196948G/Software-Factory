<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ソフトウェアファクトリーステーション</title>
<link rel="stylesheet" href="/station.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" data-ic="factory"></span>
    <div><b>ソフトウェアファクトリーステーション</b><small id="brandsub">依頼の受付・注文書づくり・承認の流れ サンプル（完全オフライン）</small></div>
    <span class="live" id="stat"><i class="ld"></i>完全オフライン</span>
  </div>
  <div class="topctl">
    <span class="clock" id="clock"></span>
    <span class="actorbox" id="actorav"></span>
    <select id="role" aria-label="操作する人"></select>
    <button class="btn ghost sm" id="themebtn" data-a="theme" title="表示テーマ切替" type="button"></button>
    <button class="btn ghost sm" data-ic="download" data-a="exportJSON" title="JSONで書き出す" type="button"><span class="hide-sm">エクスポート</span></button>
    <button class="btn ghost sm" data-ic="upload" data-a="importPick" title="JSONを取り込む" type="button"><span class="hide-sm">インポート</span></button>
    <button class="btn ghost sm" data-ic="reset" data-a="reset" title="サンプルデータに戻す" type="button"><span class="hide-sm">初期化</span></button>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn ghost sm out" id="logoutbtn" data-ic="logout" data-a="logout" title="ログアウト（操作を終わってログイン画面に戻る）" aria-label="ログアウト" type="button"><span class="hide-md">ログアウト</span></button>
    <input type="file" id="imp" accept=".json,application/json" hidden>
  </div>
</header>
<div class="shell">
  <nav id="nav" tabindex="0" aria-label="画面の切り替え"></nav>
  <main id="main"></main>
</div>
<div id="dmask" class="dmask" data-a="closeDrawer"></div>
<aside id="drawer" class="drawer" aria-hidden="true" aria-label="依頼の詳細"></aside>
<div id="modal" class="modal"></div>
<div id="auth" class="auth" role="dialog" aria-modal="true" aria-labelledby="authttl"></div>
<div class="stamp" id="stamp"><div class="hanko"><small>SFステーション</small><b>受付</b><span id="stampNo"></span><small id="stampDate"></small></div></div>
<div id="toast"></div>
<!--MSF_BOOT-->
<script src="/station-bridge.js"></script>
<script src="/station.js"></script>
</body>
</html>
